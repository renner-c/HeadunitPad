name: iPadOS 14 build matrix

on:
  push:
    branches: [ios14, 'ios14-*']
    tags: ['ios14-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Xcode ${{ matrix.xcode }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26, xcode: '26.6' }
          - { runner: macos-15, xcode: '26.2' }
    env:
      XCODE_VERSION: ${{ matrix.xcode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Toolchain inventory
        run: |
          xcodebuild -version
          swift --version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          TC="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          echo "--- swift lib dirs"; ls "$TC" | grep -i swift || true
          echo "--- swift-5.5/iphoneos (concurrency back-deploy)"; ls -la "$TC/swift-5.5/iphoneos" 2>&1 || true
          echo "--- swift/iphoneos compatibility libs"; ls "$TC/swift/iphoneos" 2>&1 | grep -iE 'compat|concurrency|span' || true

      - name: Install CocoaPods dependencies
        run: pod install

      - name: Build unsigned Release for iPadOS 14.3
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace HeadunitPad.xcworkspace \
            -scheme HeadunitPad \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E ': (error|warning):|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' "$RUNNER_TEMP/build.log"

      - name: Error summary
        if: always()
        run: |
          {
            echo "## Xcode ${XCODE_VERSION}"
            echo '```'
            grep -E ': error:' "$RUNNER_TEMP/build.log" | sed -E 's#^.*/(HeadunitPad|Vendor)/#\1/#' | sort -u | head -150 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect built app
        if: success()
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/HeadunitPad.app"
          find "$APP" -type f \( -perm -111 -o -name '*.dylib' \) | while read -r f; do
            echo "== ${f#$APP/}"; xcrun vtool -show-build "$f" | grep -E 'minos|sdk|platform' || true
          done
          echo "--- linked libraries"; otool -L "$APP/HeadunitPad"
          echo "--- Frameworks"; ls -la "$APP/Frameworks" 2>&1 || true
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/HeadunitPad-app.zip"

      - name: Check iOS 14.3 dyld imports
        if: success() && matrix.xcode == '26.6'
        run: |
          set -o pipefail
          scripts/fetch_ios14_sdk.sh "$RUNNER_TEMP/sdk"
          python3 scripts/check_ios14_imports.py \
            "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/HeadunitPad.app" \
            "$RUNNER_TEMP/sdk/iPhoneOS14.3.sdk" --verbose 2>&1 | tee "$RUNNER_TEMP/imports-report.txt"

      - name: Package TrollStore .ipa and jailbreak .deb
        if: success() && matrix.xcode == '26.6'
        run: |
          set -o pipefail
          brew install ldid dpkg
          scripts/package_ios14.sh \
            "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/HeadunitPad.app" \
            "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/package.log"
          {
            echo "## Packages"
            echo '```'
            ls -la "$RUNNER_TEMP/out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-xcode-${{ matrix.xcode }}
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: Upload app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-xcode-${{ matrix.xcode }}
          path: ${{ runner.temp }}/HeadunitPad-app.zip

      - name: Upload packages
        if: success() && matrix.xcode == '26.6'
        uses: actions/upload-artifact@v4
        with:
          name: HeadunitPad-iOS14-packages
          path: |
            ${{ runner.temp }}/out/*.ipa
            ${{ runner.temp }}/out/*.deb
          if-no-files-found: error

  test:
    name: Unit tests (Xcode 26.6 on macos-26)
    runs-on: macos-26
    env:
      XCODE_VERSION: '26.6'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Install CocoaPods dependencies
        run: pod install

      - name: Pick an iPad simulator
        run: |
          xcrun simctl list devices available
          UDID="$(xcrun simctl list devices available | grep -E '^ +iPad' | head -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')"
          if [ -z "$UDID" ]; then echo "No iPad simulator available"; exit 1; fi
          echo "Using simulator $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace HeadunitPad.xcworkspace \
            -scheme HeadunitPad \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd-test" \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/test.log" | grep -E ': (error|warning):|Test (Suite|Case) .*(passed|failed)|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)|BUILD FAILED' || true
          grep -q 'TEST SUCCEEDED' "$RUNNER_TEMP/test.log"

      - name: Test results
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/tests.xcresult" | tee "$RUNNER_TEMP/test-summary.json" | grep -E '"(passedTests|failedTests|skippedTests|totalTestCount|result)"' || true
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/tests.xcresult" | grep -E '"name" : "test' | sort -u | wc -l | xargs echo "distinct test methods:"

      - name: Test summary
        if: always()
        run: |
          {
            echo "## Unit tests (Xcode ${XCODE_VERSION})"
            echo '```'
            grep -E ': error:|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)' "$RUNNER_TEMP/test.log" | sed -E 's#^.*/(HeadunitPad|HeadunitPadTests|Vendor)/#\1/#' | sort -u | head -150 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-xcode-26.6
          path: ${{ runner.temp }}/test.log
          if-no-files-found: ignore

  release:
    name: Prerelease
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/ios14-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: HeadunitPad-iOS14-packages
          path: packages

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la packages
          gh release create "$TAG" --prerelease \
            --title "HeadunitPad for iPadOS 14 ($TAG)" \
            --notes-file docs/INSTALL-iOS14.md \
            packages/*.ipa packages/*.deb
